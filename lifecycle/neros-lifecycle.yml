versioning:
  scheme: in-band protocol version byte + a jointly-versioned spec/implementation snapshot
  protocol_version_field: outer header byte 0
  current_protocol_version: V0 (protocol_version = 0)
  spec_snapshot: v0.8.0
  snapshot_source: https://github.com/Neros-Technologies/APEX/blob/main/VERSION.txt
  snapshot_rule: >-
    The specification documents and the C reference implementation are versioned
    together as one snapshot; the current version is recorded in VERSION.txt.
  status: draft
  status_statement: >-
    "Status: Draft. These specifications are under active development and may change.
    Mechanical and electrical details are still being finalized." — APEX README.
  docs: https://github.com/Neros-Technologies/APEX/blob/main/spec/APEX_Core.md

version_negotiation:
  mechanism: >-
    A device attempts DEVICE_INFO at its highest supported protocol_version first. If
    the host does not support it, the host replies ACK_REJECT_VERSION (ack = 0x03) and
    the device falls back to the next-lower version it supports.
  burden: on the device — hosts always accept the highest version they support and never request a downgrade
  session_rule: once CONNECTED at a version, every frame in that session uses that version; changing version requires a reset and re-discovery
  unknown_version_rule: a frame whose protocol_version the receiver does not support MUST be dropped without acting on its contents

