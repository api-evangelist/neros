device_lifecycle:
  source: spec/APEX_Core.md §4 Device Lifecycle Status
  type: ApexV0DeviceStatus_t
  scope: host-tracked, device-level; distinct from any class-specific state machine
  states:
  - value: '0x00'
    name: UNKNOWN
    meaning: No information available for this device slot (empty / recycled).
  - value: '0x01'
    name: NEW
    meaning: >-
      Provisional. The host has assigned a device_id and replied ACK_OK, but the device
      has not yet confirmed the latch. The slot is reserved, not committed; no class
      traffic flows. A NEW slot whose device never confirms is recycled.
  - value: '0x02'
    name: CONNECTED
    meaning: Device has confirmed its ID and is ready to receive class-specific commands.
  - value: '0x03'
    name: EXPENDED
    meaning: Device has signaled it is expended; heartbeat tracking may be disabled.
  - value: '0xFF'
    name: FAULT
    meaning: >-
      Device fault — missed heartbeats or another error condition. The host frees a
      FAULT slot a few seconds later so its device_id returns to the pool.
  transitions:
  - from: UNKNOWN
    to: NEW
    trigger: host assigns a device_id and replies ACK_OK to DEVICE_INFO
  - from: NEW
    to: CONNECTED
    trigger: host receives CONFIG_ACK, or any subsequent frame bearing the assigned ID
  - from: NEW
    to: UNKNOWN
    trigger: device silent for the 5 s watchdog window — slot recycled
  - from: CONNECTED
    to: FAULT
    trigger: missed 5 s heartbeat watchdog
  - from: CONNECTED
    to: EXPENDED
    trigger: device signals it is expended
  - from: FAULT
    to: UNKNOWN
    trigger: host frees the slot (recommended >= 5 s after the fault)

implementation_maturity:
  source: lib/README.md — "Scope of v1"
  complete:
  - COBS framing, CRC-16/CCITT-FALSE
  - Outer header pack/unpack
  - Host discovery + device table + lifecycle (NEW -> CONNECTED -> EXPENDED / FAULT)
  - Device discovery + 1 Hz heartbeat + 5 s watchdog
  - NAME_REQUEST / NAME_REPLY
  - HOST_STATE broadcast
  - Activation class — Device state machine + COMMAND/ACK/STATUS/CAPABILITY
  - Activation class — Host driver
  - Multi-class on a single link (host side)
  not_implemented:
  - feature: Passthrough / hub nodes
    reason: spec marks the area as not well defined
  - feature: Baud-rate negotiation
    reason: spec does not define a CONFIG message for this yet

