aid: neros
name: Neros
description: 'Neros Technologies is an American defense manufacturer founded in 2023
  and headquartered in El Segundo, California, that designs and mass-produces low-cost,
  attritable first-person-view (FPV) drones and ground control stations for Western
  military forces. Its product line includes the ARCHER FPV airframe, ARCHER STRIKE,
  and the CROSSBOW and LONGBOW ground control stations, built on in-house flight control,
  powertrain, and radio hardware for electronic-warfare resistance. Neros publishes
  no public web API; its machine-readable interface contribution is APEX (Adaptive
  Payload EXchange), an open, MIT-licensed, plug-and-play UART protocol and mechanical
  connector standard for drone host/payload interoperability, with a C99 reference
  implementation and a hardware development kit published on GitHub.'
