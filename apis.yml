apis:
- aid: neros:apex
  name: APEX — Adaptive Payload EXchange
  description: 'APEX is Neros Technologies'' open, MIT-licensed plug-and-play protocol
    for connecting drone platforms (hosts) and payloads (devices) over a standard
    10-pin connector. The core protocol is class-agnostic — COBS framing, a 4-byte
    outer header, CRC-16/CCITT-FALSE, baud negotiation, a three-leg discovery handshake
    (DEVICE_INFO to CONFIG_REPLY to CONFIG_ACK), capability exchange, and a device
    lifecycle the host tracks — while payload behavior is defined in separate device-class
    specifications (Activation, Analog HMI, Wayfinding, Repeater; USB_FS_HUB reserved).
    It is a UART wire protocol, not an HTTP API: there is no base URL, no authentication
    scheme, and no hosted endpoint.'
