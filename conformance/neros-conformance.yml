notes: >-
  Two distinct kinds of claim are recorded here. The `standards` block is what the APEX
  protocol conforms to or references at the wire and mechanical level. The
  `defense_compliance` block is Neros' published product-level compliance posture for
  its drone hardware, which is what the `Compliance` pointer in apis.yml refers to.
  The usual web-API standards families (OAuth 2.0, OIDC, FAPI, SCIM, OData, FHIR,
  PSD2, JSON:API, RFC 9457) are recorded as not applicable rather than false — Neros
  ships no HTTP API, so those denominators do not apply.

standards:
