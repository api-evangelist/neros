defense_compliance:
  note: >-
    Product-level compliance published by Neros for its drone hardware. This is the
    posture the apis.yml `Compliance` pointer refers to; it is not a claim about the
    APEX protocol.
  programs:
  - id: blue-uas
    name: DIU Blue UAS Cleared List
    status: listed
    scope: ARCHER platform
    evidence: >-
      Neros' own homepage states ARCHER is "Mass produced with a secure supply chain and
      BlueUAS certified." Blue UAS is the U.S. Defense Innovation Unit vetting path that
      maintains a cleared list of commercial systems assessed for government use.
    authority_url: https://www.diu.mil/latest/blue-uas-refresh-list-and-framework-platforms-and-capabilities-selected
    provider_url: https://www.neros.tech/
  - id: ndaa-section-848
    name: NDAA compliance (no covered Chinese components)
    status: claimed
    scope: ARCHER family, including Archer Fiber
    evidence: >-
      Neros markets Archer Fiber as NDAA-compliant, examined for critical components
      originating in China. Vertically integrated, U.S.-based production and a secured
      supply chain are the company's stated basis for the claim.
    provider_url: https://www.neros.tech/
  no_published_certifications:
    note: >-
      No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR attestation is published.
      Neros ships hardware, not a SaaS platform; no trust center exists at
      trust.neros.tech or security.neros.tech (neither resolves in DNS).

