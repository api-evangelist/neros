topology:
  default: point-to-point UART (one host, one device)
  passthrough: >-
    A node with downstream UART ports forwards frames by device_id. It must complete its
    own discovery before forwarding anything, and MUST NOT rewrite device_id on
    upstream-bound frames.
  multi_class: >-
    A device implementing more than one class holds one DeviceSlot per class; each class
    instance is a logically distinct device on the bus with its own device_id.

